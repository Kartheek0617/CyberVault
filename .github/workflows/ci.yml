name: CyberVault Core CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  backend-security-checks:
    name: Backend Pytest Security Baseline
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Inject Secure Throwaway CI Keys
      run: |
        echo "DATABASE_URL=sqlite:///./ci_test.db" >> $GITHUB_ENV
        echo "ENVIRONMENT=development" >> $GITHUB_ENV
        echo "SECRET_KEY=$(openssl rand -hex 64)" >> $GITHUB_ENV
        echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV

    - name: Initialize CI Database
      working-directory: ./backend
      run: |
        python scripts/seed.py

    - name: Run Backend Pytest (Security Regression)
      working-directory: ./backend
      run: |
        python -m pytest -v

  frontend-build:
    name: Frontend React Vite Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Frontend Application
      working-directory: ./frontend
      run: npm run build